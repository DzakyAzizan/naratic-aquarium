<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naratic Aquarium - Stok Firebase</title>
    <style>
        /* Desain Tema Aquarium */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: #e0f7fa; 
            margin: 0; 
            padding: 15px; 
            color: #333;
        }
        .container { 
            background: white; 
            padding: 20px; 
            border-radius: 12px; 
            box-shadow: 0 4px 8px rgba(0,0,0,0.1); 
            max-width: 650px;
            margin: auto;
        }
        h2 { color: #00838f; text-align: center; margin-top: 0; }
        
        .form-group { margin-bottom: 10px; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-top: 5px; 
            box-sizing: border-box; 
            border-radius: 8px; 
            border: 1px solid #b2ebf2; 
            font-size: 14px;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            margin-top: 10px; 
            background-color: #00acc1; 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 16px;
            cursor: pointer;
        }
        button:active { background-color: #00838f; }
        
        .search-box { margin-top: 25px; margin-bottom: 15px; border-top: 2px dashed #b2ebf2; padding-top: 15px;}
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; min-width: 450px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px 10px; text-align: left; font-size: 14px;}
        th { background-color: #00838f; color: white; }
        
        .btn-edit { background-color: #ffa000; padding: 6px 10px; margin: 0; font-size: 12px; width: auto; color: white; border: none; border-radius: 4px; cursor: pointer;}
        .btn-hapus { background-color: #d32f2f; padding: 6px 10px; margin: 0; margin-top: 5px; font-size: 12px; width: auto; color: white; border: none; border-radius: 4px; cursor: pointer;}
    </style>
</head>
<body>

<div class="container">
    <h2>🌊 Naratic Aquarium 🌊<br><small style="font-size: 14px; color: #555;">Sistem Stok Realtime (Online)</small></h2>
    
    <!-- Form Tambah Barang dengan Kolom Merk -->
    <div class="form-group">
        <input type="text" id="namaBarang" placeholder="Nama Barang (Cth: Pompa Air)">
    </div>
    <div class="form-group">
        <input type="text" id="merkBarang" placeholder="Merk Barang (Cth: Amara / Yamano)">
    </div>
    <div class="form-group">
        <input type="text" id="sizeBarang" placeholder="Size/Kapasitas (Cth: 1000 L/H atau 50cm)">
    </div>
    <div class="form-group">
        <input type="number" id="jumlahBarang" placeholder="Jumlah Stok (Cth: 12)">
    </div>
    <button onclick="tambahBarang()">➕ Tambah Stok Barang</button>

    <!-- Fitur Pencarian (Bisa cari berdasarkan Nama atau Merk) -->
    <div class="search-box">
        <input type="text" id="cariBarang" placeholder="🔍 Cari nama barang atau merk..." onkeyup="cariData()">
    </div>

    <!-- Tabel Data -->
    <div class="table-responsive">
        <table>
            <thead>
                <tr>
                    <th>Nama Barang</th>
                    <th>Merk</th>
                    <th>Size</th>
                    <th>Stok</th>
                    <th>Aksi</th>
                </tr>
            </thead>
            <tbody id="tabelStok">
                <tr><td colspan="5" style="text-align:center;">⏳ Menghubungkan ke Database...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<!-- KODE JAVASCRIPT & FIREBASE -->
<script type="module">
    // Import fungsi Firebase
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, push, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    // Konfigurasi Database Milikmu
    const firebaseConfig = {
        apiKey: "AIzaSyDC2Va8LYKuoXYIZsr6Rkzxj65PT8vZFuQ",
        authDomain: "naratic-aquarium.firebaseapp.com",
        databaseURL: "https://naratic-aquarium-default-rtdb.firebaseio.com",
        projectId: "naratic-aquarium",
        storageBucket: "naratic-aquarium.firebasestorage.app",
        messagingSenderId: "126764911494",
        appId: "1:126764911494:web:e89ff857ccd102edcdfa07"
    };

    // Memulai Firebase
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'stok-naratic');

    // Variabel untuk menyimpan data sementara agar bisa dicari
    let dataGlobal = {};

    // 1. Fungsi Membaca Data Secara Otomatis (Realtime)
    onValue(dbRef, (snapshot) => {
        dataGlobal = snapshot.val() || {};
        tampilkanData(dataGlobal);
    });

    // 2. Fungsi Menampilkan Data ke Tabel
    function tampilkanData(data) {
        let tabel = document.getElementById('tabelStok');
        tabel.innerHTML = ''; 

        if (Object.keys(data).length === 0) {
            tabel.innerHTML = '<tr><td colspan="5" style="text-align:center;">Data masih kosong.</td></tr>';
            return;
        }

        for (let id in data) {
            let item = data[id];
            let merkItem = item.merk ? item.merk : '-'; 

            tabel.innerHTML += `<tr>
                <td>${item.nama}</td>
                <td><span style="background: #e0f7fa; padding: 3px 8px; border-radius: 4px; font-weight: bold; color: #00838f;">${merkItem}</span></td>
                <td>${item.size}</td>
                <td style="font-size: 16px;"><strong>${item.jumlah}</strong></td>
                <td>
                    <button class="btn-edit" onclick="ubahData('${id}', '${item.nama}', '${merkItem}', '${item.size}', ${item.jumlah})">Ubah</button>
                    <button class="btn-hapus" onclick="hapusBarang('${id}', '${item.nama} (${merkItem})')">Hapus</button>
                </td>
            </tr>`;
        }
    }

    // 3. Fungsi Tambah Barang
    window.tambahBarang = function() {
        let namaInput = document.getElementById('namaBarang').value;
        let merkInput = document.getElementById('merkBarang').value;
        let sizeInput = document.getElementById('sizeBarang').value;
        let jumlahInput = document.getElementById('jumlahBarang').value;

        if(namaInput === '' || merkInput === '' || sizeInput === '' || jumlahInput === '') {
            alert('⚠️ Lengkapi semua data (Nama, Merk, Size, dan Jumlah) terlebih dahulu!');
            return;
        }

        push(dbRef, {
            nama: namaInput,
            merk: merkInput,
            size: sizeInput,
            jumlah: parseInt(jumlahInput)
        });

        // Kosongkan form setelah input
        document.getElementById('namaBarang').value = '';
        document.getElementById('merkBarang').value = '';
        document.getElementById('sizeBarang').value = '';
        document.getElementById('jumlahBarang').value = '';
    };

    // 4. Fungsi Ubah Data Lengkap (Nama, Merk, Size, Stok)
    window.ubahData = function(id, namaLama, merkLama, sizeLama, jumlahLama) {
        let namaBaru = prompt("Ubah Nama Barang:", namaLama);
        if (namaBaru === null) return; // Batal jika pencet cancel

        let merkBaru = prompt("Ubah Merk Barang:", merkLama);
        if (merkBaru === null) return;

        let sizeBaru = prompt("Ubah Size/Kapasitas:", sizeLama);
        if (sizeBaru === null) return;

        let jumlahBaru = prompt("Ubah Jumlah Stok:", jumlahLama);
        if (jumlahBaru === null || jumlahBaru === "") return;

        // Kirim update lengkap ke Firebase
        update(ref(db, 'stok-naratic/' + id), {
            nama: namaBaru,
            merk: merkBaru,
            size: sizeBaru,
            jumlah: parseInt(jumlahBaru)
        });
        
        alert('✅ Data berhasil diperbarui!');
    };

    // 5. Fungsi Hapus Barang
    window.hapusBarang = function(id, infoBarang) {
        let konfirmasi = confirm(`Yakin ingin menghapus "${infoBarang}" secara permanen?`);
        if(konfirmasi) {
            remove(ref(db, 'stok-naratic/' + id));
        }
    };

    // 6. Fungsi Pencarian (Berdasarkan Nama ATAU Merk)
    window.cariData = function() {
        let kataKunci = document.getElementById('cariBarang').value.toLowerCase();
        let dataHasilPencarian = {};
        
        for (let id in dataGlobal) {
            let item = dataGlobal[id];
            let namaBarang = item.nama ? item.nama.toLowerCase() : '';
            let merkBarang = item.merk ? item.merk.toLowerCase() : '';
            
            if (namaBarang.includes(kataKunci) || merkBarang.includes(kataKunci)) {
                dataHasilPencarian[id] = item;
            }
        }
        
        tampilkanData(dataHasilPencarian);
    };
</script>

</body>
</html>
